name: qrreader

services:

  nginx:
    image: nginx:alpine
    ports:
      - "9005:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - n8n
    restart: unless-stopped

  web:
    build: .
    expose:
      - "8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DEBUG=True
      - N8N_URL=http://n8n:5678
    restart: unless-stopped
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:2.3.4
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost:9005
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_PATH=/n8n/
      - WEBHOOK_URL=http://localhost:9005/n8n/
      - N8N_EDITOR_BASE_URL=http://localhost:9005/n8n/
      - GENERIC_TIMEZONE=Europe/Bratislava
    restart: unless-stopped

volumes:
  n8n_data: