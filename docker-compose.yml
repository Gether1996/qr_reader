services:
  redis:
    container_name: qr_reader_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    container_name: qr_reader
    build: .
    ports:
      - "9005:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DEBUG=True
    depends_on:
      - redis
    restart: unless-stopped

  celery:
    container_name: qr_reader_celery
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    command: celery -A qr_reader_django worker -l info

  telegram_bot:
    container_name: qr_reader_telegram_bot
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    command: python manage.py run_telegram_bot