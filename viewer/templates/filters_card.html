{% load i18n %}
<!-- Filters Card -->
<div class="card filters-card mb-3">
    <div class="card-header d-flex align-items-center gap-3">
        <h6 class="mb-0">
            <i class="fas fa-filter me-2"></i>{% trans "Filters" %}
        </h6>
        {% if has_active_filters %}
            <button class="btn btn-sm" type="button" onclick="clearFilters()" title="{% trans 'Clear all filters' %}" style="background: linear-gradient(135deg, #ef4444, #dc2626); color: white; font-weight: 600; padding: 0.25rem 0.75rem;">
                <i class="fas fa-filter-circle-xmark me-1"></i>{% trans "Clear" %}
            </button>
        {% endif %}
    </div>
    <div class="card-body">
        <form method="get" action="{{ form_action }}" id="filterForm" data-clear-url="{{ clear_url }}">
            <div class="row g-2">
                <div class="col-lg-3 col-md-6 col-6 filter-input-group">
                    <label class="form-label">{{ first_filter_label }}</label>
                    <input type="text" name="{{ first_filter_name }}" id="{{ first_filter_name }}_input" class="form-control" placeholder="{% trans 'Search' %}" value="{{ first_filter_value }}" list="{{ first_filter_name }}_list" autocomplete="off">
                    {% if datalist_items %}
                    <datalist id="{{ first_filter_name }}_list">
                        {% for item in datalist_items %}
                            <option value="{{ item }}">
                        {% endfor %}
                    </datalist>
                    <script>
                        document.addEventListener('DOMContentLoaded', function() {
                            const input = document.getElementById('{{ first_filter_name }}_input');
                            const datalist = document.getElementById('{{ first_filter_name }}_list');
                            
                            if (input && datalist) {
                                input.addEventListener('input', function() {
                                    const options = datalist.querySelectorAll('option');
                                    for (let option of options) {
                                        if (option.value === this.value) {
                                            // Value matches a datalist option, submit form
                                            setTimeout(() => {
                                                document.getElementById('filterForm').submit();
                                            }, 100);
                                            break;
                                        }
                                    }
                                });
                            }
                        });
                    </script>
                    {% endif %}
                </div>
                <div class="col-lg-2 col-md-3 col-6 filter-input-group">
                    <label class="form-label">{% trans "Type" %}</label>
                    <select name="scan_type" class="form-select" style="cursor: pointer;">
                        <option value="">{% trans "All" %}</option>
                        <option value="arrival" {% if current_filters.scan_type == 'arrival' %}selected{% endif %}>{% trans "Arrival" %}</option>
                        <option value="departure" {% if current_filters.scan_type == 'departure' %}selected{% endif %}>{% trans "Departure" %}</option>
                    </select>
                </div>
                <div class="col-lg-3 col-md-6 col-6 filter-input-group">
                    <label class="form-label">{% trans "Date Range" %}</label>
                    <input type="text" id="dateRangePicker" class="form-control date-range-display" readonly placeholder="{% trans 'Select' %}">
                    <input type="hidden" name="date_from" id="date_from" value="{{ current_filters.date_from }}">
                    <input type="hidden" name="date_to" id="date_to" value="{{ current_filters.date_to }}">
                </div>
                <div class="col-lg-2 col-md-3 col-6 filter-input-group">
                    <label class="form-label">{% trans "Per Page" %}</label>
                    <select name="per_page" class="form-select">
                        <option value="10" {% if current_filters.per_page == 10 %}selected{% endif %}>10</option>
                        <option value="20" {% if current_filters.per_page == 20 %}selected{% endif %}>20</option>
                        <option value="50" {% if current_filters.per_page == 50 %}selected{% endif %}>50</option>
                        <option value="100" {% if current_filters.per_page == 100 %}selected{% endif %}>100</option>
                    </select>
                </div>
                <div class="col-lg-2 col-md-12 col-12 filter-input-group filter-mobile-full d-flex align-items-end">
                    <button type="submit" class="btn w-100" style="background: linear-gradient(135deg, #2563eb, #1e40af); color: white; font-weight: 600;">
                        <i class="fas fa-search me-1"></i>{% trans "Apply" %}
                    </button>
                </div>
            </div>
            <input type="hidden" name="sort" value="{{ current_filters.sort }}">
        </form>
    </div>
</div>
