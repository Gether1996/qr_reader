events {
    worker_connections 1024;
}

http {
    # Základné nastavenia
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Upstream servery
    upstream django {
        server web:8000;
    }

    upstream n8n {
        server n8n:5678;
    }

    server {
        listen 80;
        server_name localhost;

        # Django - hlavná aplikácia
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # n8n - na /n8n/ subpath (s trailing slash)
        location /n8n/ {
            rewrite ^/n8n/(.*) /$1 break;
            proxy_pass http://n8n;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /n8n;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            
            # WebSocket support pre n8n
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Statické súbory Django
        location /static/ {
            proxy_pass http://django/static/;
        }

        # Media súbory Django
        location /media/ {
            proxy_pass http://django/media/;
        }
    }
}
