<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>QR Reader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #3b82f6 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            text-align: center;
            padding: 32px 24px;
            padding-top: env(safe-area-inset-top, 32px);
            padding-bottom: env(safe-area-inset-bottom, 32px);
        }

        .logo-wrap {
            width: 96px;
            height: 96px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            backdrop-filter: blur(8px);
        }

        .logo-wrap svg {
            width: 52px;
            height: 52px;
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            opacity: 0.75;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* Loading state */
        .state-loading .spinner { display: flex; }
        .state-loading .status-text { display: block; }
        .state-loading .offline-card { display: none; }

        /* Offline state */
        .state-offline .spinner { display: none; }
        .state-offline .status-text { display: none; }
        .state-offline .offline-card { display: block; }

        .spinner {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .spinner-ring {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            display: none;
            font-size: 14px;
            opacity: 0.8;
        }

        .offline-card {
            display: none;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 24px 28px;
            max-width: 320px;
            backdrop-filter: blur(12px);
        }

        .offline-icon {
            font-size: 40px;
            margin-bottom: 14px;
        }

        .offline-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .offline-desc {
            font-size: 14px;
            opacity: 0.75;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .retry-btn {
            display: inline-block;
            padding: 12px 28px;
            background: white;
            color: #2563eb;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
            width: 100%;
        }

        .retry-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body class="state-loading">

    <div class="logo-wrap">
        <!-- QR code icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <line x1="14" y1="14" x2="16" y2="14"/>
            <line x1="14" y1="17" x2="14" y2="20"/>
            <line x1="17" y1="17" x2="20" y2="17"/>
            <line x1="20" y1="14" x2="20" y2="14"/>
            <line x1="17" y1="20" x2="20" y2="20"/>
        </svg>
    </div>

    <h1>QR Reader</h1>
    <p class="subtitle">Dochádzka &amp; QR skenovanie</p>

    <!-- Loading state -->
    <div class="spinner">
        <div class="spinner-ring"></div>
        <span class="status-text">Pripájanie k serveru...</span>
    </div>

    <!-- Offline state -->
    <div class="offline-card">
        <div class="offline-icon">📡</div>
        <div class="offline-title">Žiadne pripojenie</div>
        <p class="offline-desc">Aplikácia potrebuje internetové pripojenie. Skontrolujte Wi-Fi alebo mobilné dáta.</p>
        <button class="retry-btn" onclick="checkAndReload()">Skúsiť znova</button>
    </div>

    <script>
        function setOffline() {
            document.body.className = 'state-offline';
        }

        function setLoading() {
            document.body.className = 'state-loading';
        }

        function checkAndReload() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                setOffline();
            }
        }

        // This page is the fallback shown when Capacitor cannot reach the server URL.
        // When server URL is configured in capacitor.config.json, this page is bypassed.
        window.addEventListener('online', function () {
            setLoading();
            setTimeout(function () {
                window.location.reload();
            }, 500);
        });

        window.addEventListener('offline', setOffline);

        if (!navigator.onLine) {
            setOffline();
        }
    </script>
</body>
</html>
